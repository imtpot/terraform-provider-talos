name: fork-acceptance-diagnostic
concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
on:
  push:
    branches: [debug/acc-pr397]
permissions:
  contents: read
jobs:
  acc-tests:
    if: github.repository == 'imtpot/terraform-provider-talos'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify KVM
        run: |
          test -c /dev/kvm
          sudo test -r /dev/kvm
          sudo test -w /dev/kvm
          nproc
          free -h
          df -h /
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Set up libvirt
        env:
          LIBVIRT_DEFAULT_URI: qemu:///system
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bridge-utils \
            dnsmasq-base \
            libvirt-daemon-system \
            qemu-utils \
            qemu-block-extra \
            qemu-system-x86 \
            ovmf

          sudo ln -sf OVMF_VARS_4M.fd /usr/share/OVMF/OVMF_VARS.fd
          sudo ln -sf OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd

          echo 'security_driver = "none"' | sudo tee --append /etc/libvirt/qemu.conf
          sudo systemctl restart libvirtd
          echo -e "<pool type='dir'>\n<name>default</name>\n<target>\n<path>/pool-default</path>\n</target>\n</pool>" > pool.xml
          sudo mkdir /pool-default
          sudo chmod a+rwx /pool-default
          sudo virsh pool-define pool.xml
          sudo virsh pool-start default
          cat <<EOF > net.xml
          <network>
            <name>default</name>
            <bridge name='virbr0'/>
            <mtu size="1350"/>
            <forward/>
            <ip address='192.168.122.1' netmask='255.255.255.0'>
              <dhcp>
                <range start='192.168.122.2' end='192.168.122.254'/>
              </dhcp>
            </ip>
          </network>
          EOF
          sudo virsh net-destroy default || true
          sudo virsh net-undefine default || true
          sudo virsh net-create net.xml
      - name: Runner info
        run: nproc && free -h
      - name: acceptance-test
        env:
          # The runner has /dev/kvm available; kvm-accelerated domains boot
          # ~3.3x faster than qemu (software emulation).
          TERRAFORM_LIBVIRT_TEST_DOMAIN_TYPE: kvm
          LIBVIRT_DEFAULT_URI: qemu:///system
          CI: "true"
        run: |
          TF_CLI_CONFIG_FILE=thisfiledoesnotexist TF_ACC=1 go test -v \
            -run '^TestAccTalosCluster_bootstrapHA$' \
            -parallel=4 -count=3 -timeout=60m -exec='sudo -E' ./pkg/talos
